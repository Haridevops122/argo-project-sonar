name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Check Docker
        run: docker --version

      - name: Build Docker image
        run: |
          docker build -t java-devops-app:${{ github.sha }} .

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'java-devops-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag java-devops-app:${{ github.sha }} \
            devclouds/java-devops-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push devclouds/java-devops-app:${{ github.sha }}