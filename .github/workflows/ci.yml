name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Read and Increment Version
        id: version
        run: |
          VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "$NEW_VERSION" > VERSION

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          echo "Old version: $VERSION"
          echo "New version: $NEW_VERSION"

      - name: Check Docker
        run: docker --version

      - name: Build Docker image
        run: |
          docker build \
            -t java-devops-app:${{ steps.version.outputs.version }} .

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'java-devops-app:${{ steps.version.outputs.version }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag java-devops-app:${{ steps.version.outputs.version }} \
            devclouds/java-devops-app:${{ steps.version.outputs.version }}

      - name: Push Docker image
        run: |
          docker push devclouds/java-devops-app:${{ steps.version.outputs.version }}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: devclouds/java-devops-app:.*|image: devclouds/java-devops-app:${{ steps.version.outputs.version }}|" k8s/deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION k8s/deployment.yaml

          git commit -m "Release version ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"

          git push